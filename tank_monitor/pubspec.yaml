name: tank_monitor
description: A Flutter app for tank level monitoring and pump control.
publish_to: "none" # this is a private package
version: 0.1.0+1
environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  http: ^1.1.0
  provider: ^6.0.0
  socket_io_client: ^3.1.1
  fl_chart: ^1.2.0
  firebase_core: ^2.15.0
  firebase_messaging: ^14.6.5
  flutter_local_notifications: ^13.0.0
  intl: ^0.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  change_app_package_name: ^1.5.0

flutter:
  uses-material-design: true
